#name: floci-azure-terraform

services:

  # https://github.com/floci-io/floci/releases
  floci-aws:
    image: floci/floci:2.5.0
    container_name: floci-aws
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: "America/Bogota"
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

  # https://github.com/floci-io/floci-az/releases
  floci-az:
    image: floci/floci-az:0.17.0
    container_name: floci-az
    ports:
      - "4577:4577"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      TZ: "America/Bogota"
      # El provider de Azure descubre la nube por HTTPS (metadata_host): sin TLS no arranca
      FLOCI_AZ_TLS_ENABLED: "true"
      # Todo en memoria: si se reinicia, se pierde todo (y un terraform apply lo recrea)
      FLOCI_AZ_STORAGE_MODE: memory
      # VMs: "true" = solo plano de control (dice running, pero no corre nada).
      # "false" = cada VM es un contenedor Linux (no es una VM real: sin kernel propio ni SSH)
      FLOCI_AZ_SERVICES_VM_MOCKED: "true"

  # https://github.com/floci-io/floci-gcp/releases
  floci-gcp:
    image: floci/floci-gcp:0.13.0
    container_name: floci-gcp
    ports:
      - "4588:4588"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: "America/Bogota"

  # https://github.com/floci-io/floci-oci/releases
  floci-oci:
    image: floci/floci-oci:0.7.0
    container_name: floci-oci
    ports:
      - "4599:4599"
    environment:
      TZ: "America/Bogota"
      # Sin socket de Docker: Functions y OKE quedan en modo simulado
      FLOCI_OCI_SERVICES_FUNCTIONS_MOCK: "true"
      FLOCI_OCI_SERVICES_OKE_MOCK: "true"

  # https://github.com/floci-io/floci-ui/releases
  floci-ui:
    image: floci/floci-ui:0.7.0
    container_name: floci-ui
    ports:
      - "4500:4500"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: "America/Bogota"
      # AWS
      FLOCI_ENDPOINT: http://floci-aws:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # AZURE
      FLOCI_AZURE_ENDPOINT: http://floci-az:4577
      FLOCI_AZURE_SUBSCRIPTION_ID: "00000000-0000-0000-0000-000000000001"
      # OJO: la interfaz muestra los blobs de UNA sola cuenta de storage y las bases
      # de UN solo resource group. Usa estos mismos nombres en tus main.tf.
      FLOCI_AZURE_ACCOUNT_NAME: "${UI_STORAGE_ACCOUNT:-stflocidemo}"
      FLOCI_AZURE_RESOURCE_GROUP: "${UI_RESOURCE_GROUP:-rg-floci-demo}"
      # GCP - Google Cloud
      FLOCI_GCP_ENDPOINT: http://floci-gcp:4588
      FLOCI_GCP_PROJECT: floci-local
      # OCI - Oracle Cloud
      FLOCI_OCI_ENDPOINT: http://floci-oci:4599
    depends_on: [ floci-aws, floci-az, floci-gcp, floci-oci]
