name: Terraform Validation

on:
  push:
    paths:
      - 'terraform/**'

jobs:

  validate:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/floci/clouds/aws/environments/dev

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
