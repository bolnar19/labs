name: Terraform Validation

on:
  push:
    paths:
      - 'terraform/**'

jobs:

  validate:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/clouds/aws/environments/dev

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      #################################
      # TERRAFORM
      #################################

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      #################################
      # TFLINT
      #################################

      - name: TFLint Setup
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Show version
        run: tflint --version

      - name: TFLint Init
        run: tflint --init

      - name: TFLint Run
        run: tflint

      #################################
      # CHECKOV
      #################################

      - name: Checkov Run Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/clouds/aws
          framework: terraform
          quiet: true
          soft_fail: true

          #skip_check: >
          #  CKV_AWS_24,
          #  CKV_AWS_25,
          #  CKV_AWS_260,
          #  CKV_AWS_277,
          #  CKV_AWS_382
